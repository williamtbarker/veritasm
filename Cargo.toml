[package]
name = "veritasm"
version = "0.4.0-dev.1"
default-run = "veritasm"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["William Barker"]
description = "Evidence-first deterministic de novo unitig assembly from short reads"
readme = "README.md"
keywords = ["bioinformatics", "assembly", "de-bruijn-graph", "fastq", "rust"]
categories = ["science", "command-line-utilities"]
publish = false
exclude = [
    "target/",
    "*.zip",
    "*.sha256",
    "/.github/",
    "/fuzz/",
    "/scripts/package_source.sh",
    "/scripts/source-package-files.txt",
    "/scripts/test_release_verifier_finalization.sh",
    "/scripts/test_release_verifier_tree_manifest.sh",
    "/scripts/verify_release_candidate.sh",
]

[lib]
name = "veritasm"
path = "src/lib.rs"

[[bin]]
name = "veritasm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.23"
thiserror = "2.0"
rustix = { version = "1.1.4", default-features = false, features = ["fs"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
proptest = "1.7"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
